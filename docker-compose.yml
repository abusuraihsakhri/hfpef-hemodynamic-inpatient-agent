version: '3.8'

services:
  hfpef-hemodynamic-inpatient-engine:
    build: .
    container_name: hfpef-hemodynamic-inpatient-engine
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-please-change-this-to-a-secure-random-value}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
