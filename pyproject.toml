[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hfpef-hemodynamic-inpatient-engine"
version = "2.0.0"
description = "HFpEF Inpatient Sentinel: Congestion Trajectory & Diuretic Resistance Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hfpef-hemodynamic-inpatient-engine = "hfpef_hemodynamic_inpatient_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/hfpef-hemodynamic-inpatient-engine"
Repository = "https://github.com/abusuraihsakhri/hfpef-hemodynamic-inpatient-engine.git"
