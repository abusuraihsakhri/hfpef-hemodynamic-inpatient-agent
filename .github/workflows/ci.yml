name: Hfpef Hemodynamic Inpatient Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[api,test]"

    - name: Check installed package dependencies
      run: python -m pip check

    - name: Compile Python source
      run: python -m compileall -q agents hfpef_hemodynamic_inpatient_agent

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Browser demo unit tests
      run: node --test tests/browser_demo.test.mjs

    - name: HMAC integrity smoke check
      run: |
        python -c "
        from agents.base import AuditTrail
        trail = AuditTrail(secret_key='ci-smoke-key')
        trail.log('ci', 'test', 'CHECK', {'synthetic': True})
        assert trail.verify_integrity()
        trail.logs[-1]['current_hash'] = '0' * 64
        assert not trail.verify_integrity()
        print('Audit integrity check passed')
        "
